<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexERP Enterprise Platform | Next-Gen Business Suite</title>
  <meta name="description" content="Comprehensive Enterprise Resource Planning system featuring Financials, Inventory, CRM, HCM, MRP, Projects, and BI Analytics.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ApexERP Enterprise Platform Design System */
    :root {
      --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --bg-app: #0b0f19;
      --bg-sidebar: #111827;
      --bg-header: rgba(17, 24, 39, 0.85);
      --bg-card: #1f293d;
      --bg-card-hover: #26334d;
      --bg-input: #151d2a;
      --bg-elevated: #28354e;
      
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-strong: rgba(255, 255, 255, 0.16);

      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-primary-light: rgba(99, 102, 241, 0.15);
      --accent-secondary: #06b6d4;
      --accent-purple: #8b5cf6;

      --color-success: #10b981;
      --color-success-bg: rgba(16, 185, 129, 0.15);
      --color-warning: #f59e0b;
      --color-warning-bg: rgba(245, 158, 11, 0.15);
      --color-danger: #ef4444;
      --color-danger-bg: rgba(239, 68, 68, 0.15);
      --color-info: #3b82f6;
      --color-info-bg: rgba(59, 130, 246, 0.15);

      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
      --glow-primary: 0 0 20px rgba(99, 102, 241, 0.25);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.light-theme {
      --bg-app: #f4f6f9;
      --bg-sidebar: #ffffff;
      --bg-header: rgba(255, 255, 255, 0.9);
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --bg-input: #f1f5f9;
      --bg-elevated: #e2e8f0;

      --border-color: #e2e8f0;
      --border-color-strong: #cbd5e1;

      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg-app); color: var(--text-main); line-height: 1.5; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 4px; }

    .app-container { display: flex; min-height: 100vh; width: 100vw; }
    .main-layout { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-app); }
    .content-viewport { flex: 1; padding: 1.5rem 2rem; overflow-y: auto; }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); transition: border-color var(--transition-normal); margin-bottom: 1.5rem; }
    .card:hover { border-color: var(--border-color-strong); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .card-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; color: var(--text-main); }
    .card-subtitle { font-size: 0.85rem; color: var(--text-muted); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.55rem 1.1rem; font-family: var(--font-sans); font-size: 0.875rem; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; transition: all var(--transition-fast); white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)); color: #ffffff; box-shadow: var(--glow-primary); }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #ffffff; }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-main); border-color: var(--border-color); }
    .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-color-strong); }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    .btn-danger-sm { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.65rem; font-size: 0.75rem; font-weight: 600; border-radius: 9999px; }
    .badge-success { background: var(--color-success-bg); color: var(--color-success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-warning { background: var(--color-warning-bg); color: var(--color-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-danger { background: var(--color-danger-bg); color: var(--color-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-info { background: var(--color-info-bg); color: var(--color-info); border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-neutral { background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border-color); }

    .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .form-input, .form-select { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.6rem 0.85rem; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 0.875rem; outline: none; }
    .form-input:focus, .form-select:focus { border-color: var(--accent-primary); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .kpi-card { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); position: relative; overflow: hidden; }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-primary); }
    .kpi-card.success::before { background: var(--color-success); }
    .kpi-card.warning::before { background: var(--color-warning); }
    .kpi-card.purple::before { background: var(--accent-purple); }
    .kpi-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .kpi-value { font-size: 1.65rem; font-weight: 800; color: var(--text-main); margin: 0.2rem 0; }
    .kpi-change { font-size: 0.75rem; font-weight: 600; }

    .table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    .data-table th { background: var(--bg-elevated); color: var(--text-muted); font-weight: 700; text-transform: uppercase; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); }
    .data-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); color: var(--text-main); white-space: nowrap; }
    .data-table tbody tr:hover { background-color: var(--bg-card-hover); }
    .mono { font-family: var(--font-mono); }

    /* Modal Styles */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1.5rem; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border-color-strong); border-radius: var(--radius-lg); width: 100%; max-width: 550px; box-shadow: var(--shadow-lg); overflow: hidden; }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem; background: var(--bg-elevated); }
  </style>
</head>
<body class="dark-theme">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext, useMemo } = React;

    // Subsidiaries & Modules Definitions
    const SUBSIDIARIES = [
      { id: 'sub-global', name: 'Apex Global HQ (New York)', currency: 'USD', symbol: '$' },
      { id: 'sub-emea', name: 'Apex EMEA Ltd (London)', currency: 'GBP', symbol: '£' },
      { id: 'sub-apac', name: 'Apex APAC Pte (Singapore)', currency: 'SGD', symbol: 'S$' }
    ];

    const MODULES = [
      { id: 'dashboard', name: 'Executive Control Center', badge: 'Overview' },
      { id: 'finance', name: 'Finance & Accounting', badge: 'GL / AR / AP' },
      { id: 'inventory', name: 'Supply Chain & Inventory', badge: 'FIFO / Stock' },
      { id: 'sales', name: 'Sales & CRM Pipeline', badge: 'Deals / Leads' },
      { id: 'hcm', name: 'Human Capital & Payroll', badge: 'HR / Salaries' },
      { id: 'procurement', name: 'Procurement & Vendors', badge: 'POs / Bills' },
      { id: 'mrp', name: 'Manufacturing & MRP', badge: 'BOM / WO' },
      { id: 'projects', name: 'Projects & Gantt Timeline', badge: 'Tasks' },
      { id: 'analytics', name: 'BI & Custom Analytics', badge: 'KPIs' },
      { id: 'admin', name: 'Admin, RBAC & Audit', badge: 'Security' }
    ];

    // Enterprise Initial Data Generators
    const initialInvoices = [
      { id: 'INV-2026-101', client: 'Acme Tech Corp', date: '2026-01-12', dueDate: '2026-02-12', total: 45000, status: 'Paid' },
      { id: 'INV-2026-102', client: 'Nexus Global Systems', date: '2026-01-15', dueDate: '2026-02-15', total: 78000, status: 'Pending' },
      { id: 'INV-2026-103', client: 'Starlight Logistics', date: '2026-02-01', dueDate: '2026-03-01', total: 32000, status: 'Paid' },
      { id: 'INV-2026-104', client: 'Vanguard Health', date: '2026-02-10', dueDate: '2026-03-10', total: 95000, status: 'Overdue' }
    ];

    const initialInventory = [
      { id: 'SKU-1001', name: 'Apex Server License Unit', category: 'Hardware', warehouse: 'WH-Alpha (Chicago)', qtyOnHand: 145, unitCost: 1200.00, status: 'Optimal Stock' },
      { id: 'SKU-1002', name: 'IoT Telemetry Gateway v2', category: 'Electronics', warehouse: 'WH-Beta (Frankfurt)', qtyOnHand: 18, unitCost: 320.00, status: 'Low Stock Warning' },
      { id: 'SKU-1003', name: 'Rugged RFID Scanner Terminal', category: 'Hardware', warehouse: 'WH-Gamma (Tokyo)', qtyOnHand: 65, unitCost: 450.00, status: 'Optimal Stock' }
    ];

    const initialLeads = [
      { id: 'LEAD-301', company: 'BioGenX Labs', contact: 'Dr. Aris Thorne', value: 125000, stage: 'Proposal Sent', owner: 'Sarah Jenkins' },
      { id: 'LEAD-302', company: 'CyberSec Sentinel', contact: 'Marcus Vance', value: 85000, stage: 'Lead Qualification', owner: 'David Chen' },
      { id: 'LEAD-303', company: 'Orbital Aerospace', contact: 'Eleanor Vance', value: 240000, stage: 'Closed Won', owner: 'Sarah Jenkins' }
    ];

    const initialEmployees = [
      { id: 'EMP-501', name: 'Alexander Wright', department: 'Executive Management', role: 'Chief Executive Officer', salaryMonthly: 18500, netPayMonthly: 14800, status: 'Active' },
      { id: 'EMP-502', name: 'Sophia Martinez', department: 'Finance & Accounting', role: 'Chief Financial Officer', salaryMonthly: 14500, netPayMonthly: 11600, status: 'Active' },
      { id: 'EMP-503', name: 'Julian Kovac', department: 'Engineering & R&D', role: 'Principal Architect', salaryMonthly: 12500, netPayMonthly: 10000, status: 'Active' }
    ];

    const initialVendors = [
      { id: 'VEND-801', name: 'Silicon Microfabrication Corp', contact: 'Chen Wei', category: 'Semiconductors', outstandingBalance: 34000, rating: '5.0★' },
      { id: 'VEND-802', name: 'Metals & Alloys Supply Co', contact: 'Sarah Jenkins', category: 'Aluminum Alloys', outstandingBalance: 64000, rating: '4.8★' }
    ];

    const initialWorkOrders = [
      { id: 'WO-401', parentItemSku: 'APX-HW-500', bomId: 'BOM-IOT-500', targetQty: 50, status: 'IN_PROGRESS', estCost: 24000 },
      { id: 'WO-402', parentItemSku: 'APX-SER-001', bomId: 'BOM-SER-100', targetQty: 20, status: 'PLANNED', estCost: 48000 }
    ];

    const initialProjects = [
      { id: 'PRJ-701', name: 'Global ERP Migration Phase 1', client: 'Acme Tech Corp', budgetUSD: 250000, progress: '65%', status: 'On Track' },
      { id: 'PRJ-702', name: 'IoT Telemetry Fleet Deployment', client: 'Starlight Logistics', budgetUSD: 180000, progress: '40%', status: 'In Review' }
    ];

    const initialAuditLogs = [
      { id: 'AUD-901', timestamp: '2026-08-25 11:30:00', user: 'Alex Mercer', role: 'SUPER_ADMIN', action: 'POST_JOURNAL_ENTRY', ip: '127.0.0.1' },
      { id: 'AUD-902', timestamp: '2026-08-25 11:45:00', user: 'Sophia Martinez', role: 'FINANCE_MANAGER', action: 'EXECUTE_PAYROLL', ip: '127.0.0.1' }
    ];

    // React Context
    const ERPContext = createContext();

    const ERPProvider = ({ children }) => {
      const [theme, setTheme] = useState('dark');
      const [activeSubsidiary, setActiveSubsidiary] = useState(SUBSIDIARIES[0]);
      const [activeModule, setActiveModule] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      // State Repositories (Editable & Updatable)
      const [invoices, setInvoices] = useState(initialInvoices);
      const [inventory, setInventory] = useState(initialInventory);
      const [leads, setLeads] = useState(initialLeads);
      const [employees, setEmployees] = useState(initialEmployees);
      const [vendors, setVendors] = useState(initialVendors);
      const [workOrders, setWorkOrders] = useState(initialWorkOrders);
      const [projects, setProjects] = useState(initialProjects);
      const [auditLogs, setAuditLogs] = useState(initialAuditLogs);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const addAuditLog = (action, user = 'Alex Mercer') => {
        const newLog = {
          id: `AUD-${Date.now().toString().slice(-4)}`,
          timestamp: new Date().toISOString().replace('T', ' ').slice(0, 19),
          user,
          role: 'SUPER_ADMIN',
          action,
          ip: '127.0.0.1'
        };
        setAuditLogs(prev => [newLog, ...prev]);
      };

      return (
        <ERPContext.Provider value={{
          theme, setTheme, activeSubsidiary, setActiveSubsidiary,
          activeModule, setActiveModule, searchQuery, setSearchQuery, toast, showToast,
          invoices, setInvoices, inventory, setInventory, leads, setLeads,
          employees, setEmployees, vendors, setVendors, workOrders, setWorkOrders,
          projects, setProjects, auditLogs, setAuditLogs, addAuditLog
        }}>
          {children}
        </ERPContext.Provider>
      );
    };

    // Header Component
    const Header = () => {
      const { activeSubsidiary, setActiveSubsidiary, searchQuery, setSearchQuery, toast } = useContext(ERPContext);
      return (
        <header style={{ height: '65px', background: 'var(--bg-header)', borderBottom: '1px solid var(--border-color)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 2rem' }}>
          <input
            type="text"
            className="form-input"
            placeholder="Search SKUs, Invoices, Leads, Employees, POs..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            style={{ width: '360px', borderRadius: '20px', fontSize: '0.825rem' }}
          />

          <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
            <select
              value={activeSubsidiary.id}
              onChange={(e) => setActiveSubsidiary(SUBSIDIARIES.find(s => s.id === e.target.value))}
              className="form-select"
              style={{ fontSize: '0.8rem', fontWeight: 600 }}
            >
              {SUBSIDIARIES.map(s => <option key={s.id} value={s.id}>{s.name} ({s.currency})</option>)}
            </select>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', borderLeft: '1px solid var(--border-color)', paddingLeft: '0.75rem' }}>
              <div style={{ width: '34px', height: '34px', borderRadius: '50%', background: 'var(--accent-primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800 }}>EX</div>
              <div>
                <div style={{ fontSize: '0.825rem', fontWeight: 700 }}>Alex Mercer</div>
                <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>Super Admin</div>
              </div>
            </div>
          </div>

          {toast && (
            <div style={{ position: 'fixed', bottom: '24px', right: '24px', background: 'var(--bg-card)', border: '1px solid var(--accent-primary)', color: '#fff', padding: '0.85rem 1.4rem', borderRadius: 'var(--radius-md)', boxShadow: 'var(--shadow-lg)', zIndex: 999 }}>
              ✨ {toast}
            </div>
          )}
        </header>
      );
    };

    // Sidebar Component
    const Sidebar = () => {
      const { activeModule, setActiveModule } = useContext(ERPContext);
      return (
        <aside style={{ width: '270px', background: 'var(--bg-sidebar)', borderRight: '1px solid var(--border-color)', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '1.25rem 1.5rem', borderBottom: '1px solid var(--border-color)', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
            <div style={{ width: '36px', height: '36px', borderRadius: 'var(--radius-md)', background: 'linear-gradient(135deg, #6366f1, #06b6d4)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 800 }}>⚡</div>
            <div>
              <h1 style={{ fontSize: '1.1rem', fontWeight: 800 }}>ApexERP</h1>
              <span style={{ fontSize: '0.65rem', color: 'var(--accent-primary)', fontWeight: 700 }}>ENTERPRISE SUITE</span>
            </div>
          </div>

          <div style={{ flex: 1, padding: '0.75rem', display: 'flex', flexDirection: 'column', gap: '0.35rem', overflowY: 'auto' }}>
            {MODULES.map(m => {
              const active = activeModule === m.id;
              return (
                <button
                  key={m.id}
                  onClick={() => setActiveModule(m.id)}
                  style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.65rem 0.85rem', borderRadius: 'var(--radius-sm)', border: 'none',
                    background: active ? 'var(--accent-primary-light)' : 'transparent',
                    color: active ? 'var(--accent-primary)' : 'var(--text-muted)',
                    fontWeight: active ? 700 : 500, fontSize: '0.85rem', cursor: 'pointer', textAlign: 'left'
                  }}
                >
                  <span>{m.name}</span>
                  <span style={{ fontSize: '0.7rem', opacity: 0.7, background: 'var(--bg-elevated)', padding: '2px 6px', borderRadius: '4px' }}>{m.badge}</span>
                </button>
              );
            })}
          </div>
        </aside>
      );
    };

    // Table Component Utility
    const DataTable = ({ columns, data, onDelete }) => {
      const { searchQuery } = useContext(ERPContext);
      const filtered = useMemo(() => {
        if (!searchQuery) return data;
        const q = searchQuery.toLowerCase();
        return data.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(q)));
      }, [data, searchQuery]);

      return (
        <div className="table-responsive">
          <table className="data-table">
            <thead>
              <tr>
                {columns.map(c => <th key={c.key}>{c.label}</th>)}
                {onDelete && <th>Actions</th>}
              </tr>
            </thead>
            <tbody>
              {filtered.map((row, idx) => (
                <tr key={row.id || idx}>
                  {columns.map(c => <td key={c.key}>{c.render ? c.render(row[c.key], row) : row[c.key]}</td>)}
                  {onDelete && (
                    <td>
                      <button className="btn btn-sm btn-danger-sm" onClick={() => onDelete(row.id)}>Delete</button>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    };

    // --- MODULE VIEWS & EDIT/ADD MODALS ---

    // 1. Dashboard Module
    const DashboardModule = () => {
      const { invoices, inventory, employees, activeSubsidiary } = useContext(ERPContext);
      const totalRev = invoices.reduce((a, b) => a + b.total, 0);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div className="kpi-grid">
            <div className="kpi-card success">
              <div>
                <span className="kpi-label">Gross Revenue (YTD)</span>
                <div className="kpi-value">{activeSubsidiary.symbol}{(totalRev / 1000).toFixed(1)}k</div>
                <div className="kpi-change" style={{ color: 'var(--color-success)' }}>+18.4% YoY Growth</div>
              </div>
            </div>
            <div className="kpi-card">
              <div>
                <span className="kpi-label">Inventory SKUs</span>
                <div className="kpi-value">{inventory.length} SKUs</div>
                <div className="kpi-change">4 Warehouses Active</div>
              </div>
            </div>
            <div className="kpi-card warning">
              <div>
                <span className="kpi-label">Active Headcount</span>

        showToast(`Deleted project ${id}`);
      };

      const cols = [
        { key: 'id', label: 'Project ID', render: (v) => <span className="mono" style={{ fontWeight: 700 }}>{v}</span> },
        { key: 'name', label: 'Project Name' },
        { key: 'client', label: 'Client / Organization' },
        { key: 'budgetUSD', label: 'Allocated Budget', render: (v) => <span className="mono">{activeSubsidiary.symbol}{v.toLocaleString()}</span> },
        { key: 'progress', label: 'Completion Progress', render: (v) => <span className="mono" style={{ fontWeight: 700, color: 'var(--color-success)' }}>{v}</span> },
        { key: 'status', label: 'Status', render: (v) => <span className="badge badge-info">{v}</span> }
      ];

      return (
        <div className="card">
          <div className="card-header">
            <div>
              <h3 className="card-title">Enterprise Project Portfolio Management</h3>
              <span className="card-subtitle">Milestones, task tracking, and budget commitments</span>
            </div>
            <button className="btn btn-primary" onClick={() => setModalOpen(true)}>+ Create New Project</button>
          </div>
          <DataTable columns={cols} data={projects} onDelete={handleDeleteProject} />

          {modalOpen && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div className="modal-header">
                  <h3 className="modal-title">Create New Enterprise Project</h3>
                  <button className="btn-icon" onClick={() => setModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={handleAddProject}>
                  <div className="modal-body">
                    <div className="form-group">
                      <label className="form-label">Project Name</label>
                      <input className="form-input" required value={name} onChange={e => setName(e.target.value)} placeholder="e.g. AI Vision Quality Control Rollout" />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Budget ($ USD)</label>
                      <input className="form-input" type="number" required value={budget} onChange={e => setBudget(e.target.value)} />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Create Project</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 9. Analytics & BI Module
    const AnalyticsModule = () => {
      const { showToast } = useContext(ERPContext);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div className="kpi-grid">
            <div className="kpi-card success">
              <div>
                <span className="kpi-label">Net Profit Margin</span>
                <div className="kpi-value">28.4%</div>
                <div className="kpi-change" style={{ color: 'var(--color-success)' }}>Above Target Benchmark</div>
              </div>
            </div>
            <div className="kpi-card warning">
              <div>
                <span className="kpi-label">OEE Machine Efficiency</span>
                <div className="kpi-value">87.2%</div>
                <div className="kpi-change" style={{ color: 'var(--color-warning)' }}>World-Class Level</div>
              </div>
            </div>
            <div className="kpi-card purple">
              <div>
                <span className="kpi-label">Inventory Turnover</span>
                <div className="kpi-value">6.8x / Year</div>
                <div className="kpi-change">Optimal Stock Velocity</div>
              </div>
            </div>
          </div>

          <div className="card">
            <h3 className="card-title">Custom BI Analytics & Financial Forecasting Engine</h3>
            <p className="card-subtitle" style={{ marginBottom: '1rem' }}>Export real-time multi-dimensional report snapshots</p>
            <div style={{ display: 'flex', gap: '1rem' }}>
              <button className="btn btn-secondary" onClick={() => showToast('Exported Financial Balance Sheet report to CSV file')}>📥 Export Balance Sheet (CSV)</button>
              <button className="btn btn-secondary" onClick={() => showToast('Exported Stock Valuation report to CSV file')}>📥 Export Inventory Ledger (CSV)</button>
            </div>
          </div>
        </div>
      );
    };

    // 10. Admin & Audit Module
    const AdminModule = () => {
      const { auditLogs } = useContext(ERPContext);
      const cols = [
        { key: 'id', label: 'Audit ID', render: (v) => <span className="mono" style={{ fontWeight: 700 }}>{v}</span> },
        { key: 'timestamp', label: 'Timestamp (UTC)' },
        { key: 'user', label: 'User Identity' },
        { key: 'role', label: 'Assigned Role', render: (v) => <span className="badge badge-info">{v}</span> },
        { key: 'action', label: 'System Action', render: (v) => <span className="mono" style={{ fontWeight: 700 }}>{v}</span> },
        { key: 'ip', label: 'IP Address' }
      ];

      return (
        <div className="card">
          <div className="card-header">
            <div>
              <h3 className="card-title">System Administration, RBAC & Audit Trail</h3>
              <span className="card-subtitle">Role-based access control matrix and immutable security logs</span>
            </div>
          </div>
          <DataTable columns={cols} data={auditLogs} />
        </div>
      );
    };

    // Main App Container Assembly
    const App = () => {
      const { activeModule } = useContext(ERPContext);

      const renderView = () => {
        switch (activeModule) {
          case 'dashboard': return <DashboardModule />;
          case 'finance': return <FinanceModule />;
          case 'inventory': return <InventoryModule />;
          case 'sales': return <SalesModule />;
          case 'hcm': return <HCMModule />;
          case 'procurement': return <ProcurementModule />;
          case 'mrp': return <MRPModule />;
          case 'projects': return <ProjectsModule />;
          case 'analytics': return <AnalyticsModule />;
          case 'admin': return <AdminModule />;
          default: return <DashboardModule />;
        }
      };

      return (
        <div className="app-container">
          <Sidebar />
          <div className="main-layout">
            <Header />
            <main className="content-viewport">
              {renderView()}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ERPProvider>
        <App />
      </ERPProvider>
    );
  </script>
</body>
</html>
