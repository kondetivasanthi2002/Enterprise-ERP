name: ApexERP Enterprise Suite CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Execute Vitest Automated Test Suite (6 Core Tests)
        run: npx vitest run

      - name: Verify Code Volume (100k+ LOC Check)
        run: |
          echo "Calculating total lines of code..."
          find src tests -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.css" \) | xargs wc -l | tail -n 1
